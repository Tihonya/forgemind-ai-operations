server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The X-XSS-Protection header is obsolete (modern browsers ignore
    # it) and is intentionally not set. Script control lives in the
    # Content-Security-Policy header (set at the Caddy edge and below
    # for direct static asset access):
    #   - default-src 'self': no cross-origin loads from this SPA;
    #   - script/style/img/font-src 'self': the vite build emits no
    #     inline scripts/styles (no 'unsafe-inline' is needed);
    #   - connect-src 'self': same-origin /api/v1 API traffic only;
    #   - object-src 'none'; base-uri 'self'; frame-ancestors 'self'
    #     (X-Frame-Options above is the legacy fallback).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }
}
