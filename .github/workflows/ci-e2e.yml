name: End-to-End Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/e2e/**'
      - 'frontend/src/**'
      - 'frontend/playwright.config.ts'
      - 'backend/**'
      - 'seed/**'
      - 'docker-compose*.yml'
      - '.github/workflows/ci-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/e2e/**'
      - 'frontend/src/**'
      - 'frontend/playwright.config.ts'
      - 'backend/**'
      - 'seed/**'
      - 'docker-compose*.yml'

jobs:
  e2e:
    name: Run Golden Scenario E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          cp .env.example .env
          sed -i 's/SECRET_KEY=.*/SECRET_KEY=test_secret_key_for_ci_only_32_chars_minimum/' .env

      - name: Start services
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

      - name: Wait for backend health
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:8000/health | grep -q "\"healthy\""; do sleep 3; done'
          echo "✓ Backend healthy"

      - name: Seed database
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T backend bash -c \
            "cd /app/backend && python -m app.seed.generator.main"
          echo "✓ Database seeded"

      - name: Verify Golden Dataset via API
        run: |
          # Obtain token
          TOKEN=$(curl -sf -X POST http://localhost:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"manager.demo","password":"ManagerPass123!"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          
          # Verify PLAN-2026-W31 risks
          RISKS=$(curl -sf http://localhost:8000/api/v1/production-plans/PLAN-2026-W31/risks \
            -H "Authorization: Bearer $TOKEN")
          
          # Verify 3 risks exist
          COUNT=$(echo "$RISKS" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')
          if [ "$COUNT" != "3" ]; then
            echo "✗ Expected 3 risks, got $COUNT"
            exit 1
          fi
          echo "✓ Golden Dataset verified: 3 risks present"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend for preview
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Golden Scenario
        working-directory: ./frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173
          API_BASE_URL: http://localhost:8000
          CI: 'true'
        run: npx playwright test e2e/golden-scenario.spec.ts

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: frontend/test-results/
          retention-days: 30

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down
