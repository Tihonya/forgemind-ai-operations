# ForgeMind AI Operations — Release 1 production topology (WP-P7-02)
#
# Caddy (automatic HTTPS) -> nginx (frontend) -> FastAPI backend
#                                           -> ARQ worker
# PostgreSQL (pgvector), Redis stay on private networks only.
#
# SECURITY CONTRACT:
# - PostgreSQL and Redis are NEVER published to host ports.
# - Only Caddy publishes ports (80/443/443-udp).
# - Backend is reachable from outside ONLY through Caddy.
# - No docker socket mounts; containers run as non-root users where the
#   image provides one (backend/worker run as appuser).
# - No secrets in this file — all values come from the deployment .env
#   (see docs/infra-production.md), which is never committed.
# - All services publish log rotation settings via per-service logging
#   options so container logs cannot fill the VPS disk.
#
# The intended host: single VPS, 16 GB RAM, 200 GB storage (Phase 7
# contract, PD-1). This file MUST NOT be used to access that VPS from
# this repository task.

name: forgemind

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
    logging: &logging-defaults
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD is required}" --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
    logging: *logging-defaults

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.dockerfile
      target: production
    environment: &backend-environment
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required (OpenRouter key)}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://openrouter.ai/api/v1}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_BASE: ${OPENROUTER_API_BASE:-https://openrouter.ai/api/v1}
      OPENROUTER_CHAT_MODEL: ${OPENROUTER_CHAT_MODEL:-qwen/qwen3.7-flash}
      OPENROUTER_STRUCTURED_OUTPUT_MODE: ${OPENROUTER_STRUCTURED_OUTPUT_MODE:-json_object}
      CHAT_PROVIDER_MODE: ${CHAT_PROVIDER_MODE:-openrouter}
      DISTRIBUTED_RATE_LIMIT_ENABLED: ${DISTRIBUTED_RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_DEGRADED_MODE: ${RATE_LIMIT_DEGRADED_MODE:-fail_closed}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${CADDY_DOMAIN}}
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend
      - frontend
    logging: *logging-defaults

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.dockerfile
      target: production
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Copied into the image at build time (infra/docker/worker-healthcheck.sh)
      test: ["CMD", "/usr/local/bin/worker-healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend
    logging: *logging-defaults

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
    logging: *logging-defaults

  caddy:
    image: caddy:2-alpine
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?CADDY_DOMAIN is required (production FQDN)}
      CADDY_EMAIL: ${CADDY_EMAIL:?CADDY_EMAIL is required (TLS contact email)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
    logging: *logging-defaults

  # ------------------------------------------------------------------
  # Backup profile — opt-in daily pg_dump + 7-day retention.
  # Enabled with: docker compose -f docker-compose.prod.yml --profile backup up -d
  # Backup files land in ./backups on the HOST (bind mount), so the
  # operator owns off-host replication. See docs/infra-production.md.
  # ------------------------------------------------------------------
  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - >
        while true; do
          echo "[backup] starting pg_dump at $$(date -u +%Y-%m-%dT%H:%M:%SZ)";
          pg_dump -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Fc
            -f "/backups/forgemind-$$(date -u +%Y%m%d_%H%M%S).dump";
          find /backups -name 'forgemind-*.dump' -type f -mtime +7 -delete;
          echo "[backup] retention cleanup done";
          sleep 86400;
        done
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    logging: *logging-defaults

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge